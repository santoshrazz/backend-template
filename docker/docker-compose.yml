services:
    app:
        image: ${APP_IMAGE:-ghcr.io/santoshrazz/backend-template:latest}
        restart: unless-stopped
        env_file:
            - ../.env.production
        environment:
            NODE_ENV: production
            PORT: 3000
            REDIS_URL: redis://redis:6379
        ports:
            - "${APP_PORT:-3000}:3000"
        depends_on:
            redis:
                condition: service_healthy

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    redis_data:
